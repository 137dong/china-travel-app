<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>华夏全景 - 中国旅游指南</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
:root{--primary:#1a73e8;--primary-dark:#1557b0;--accent:#ea4335;--accent-light:#fce8e6;--success:#34a853;--warning:#fbbc04;--bg-dark:#1a1a2e;--bg-card:#16213e;--bg-panel:#0f3460;--text-primary:#e0e0e0;--text-secondary:#a0a0a0;--border:#2a2a4a;--shadow:0 4px 20px rgba(0,0,0,0.3);--radius:12px;--radius-sm:8px;--transition:all 0.3s cubic-bezier(0.4,0,0.2,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-dark);color:var(--text-primary)}
#app{display:flex;width:100vw;height:100vh}
#sidebar{width:380px;height:100vh;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:var(--transition);z-index:1000}
#sidebar.collapsed{transform:translateX(-380px)}
#main-content{flex:1;position:relative;height:100vh}
#map{width:100%;height:100%;background:#0a0a1a}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--bg-panel),var(--bg-card))}
.sidebar-header h1{font-size:22px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px}
.sidebar-header h1 i{color:var(--accent)}
.sidebar-header p{font-size:12px;color:var(--text-secondary);margin-top:4px}
.search-box{padding:15px 20px;border-bottom:1px solid var(--border)}
.search-box .input-wrap{position:relative}
.search-box input{width:100%;padding:12px 16px 12px 42px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-dark);color:var(--text-primary);font-size:14px;outline:none;transition:var(--transition)}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,115,232,0.2)}
.search-box i.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:14px}
.search-results{margin-top:8px;max-height:200px;overflow-y:auto}
.search-results .result-item{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;transition:var(--transition)}
.search-results .result-item:hover{background:var(--bg-panel)}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:12px;text-align:center;font-size:13px;color:var(--text-secondary);cursor:pointer;border:none;background:none;transition:var(--transition);position:relative}
.tab-btn:hover{color:var(--text-primary)}
.tab-btn.active{color:var(--primary)}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--primary);border-radius:2px}
.sidebar-content{flex:1;overflow-y:auto;padding:15px}
.sidebar-content::-webkit-scrollbar{width:6px}
.sidebar-content::-webkit-scrollbar-track{background:var(--bg-dark)}
.sidebar-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.card{background:var(--bg-dark);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:var(--transition)}
.card:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:600;color:#fff;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card-title i{color:var(--primary)}
.card-text{font-size:13px;color:var(--text-secondary);line-height:1.6}
.city-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.city-item{padding:10px 12px;background:var(--bg-dark);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;text-align:center;font-size:13px;transition:var(--transition)}
.city-item:hover{border-color:var(--primary);background:var(--bg-panel);transform:translateY(-1px)}
.city-item .city-name{font-weight:500;color:#fff}
.city-item .city-count{font-size:11px;color:var(--text-secondary);margin-top:2px}
.attraction-item{display:flex;gap:12px;padding:12px;background:var(--bg-dark);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;cursor:pointer;transition:var(--transition)}
.attraction-item:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.attraction-item .thumb{width:70px;height:70px;border-radius:var(--radius-sm);object-fit:cover;background:var(--bg-panel);flex-shrink:0}
.attraction-item .info{flex:1;min-width:0}
.attraction-item .info .name{font-size:14px;font-weight:600;color:#fff;margin-bottom:4px}
.attraction-item .info .desc{font-size:12px;color:var(--text-secondary);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.attraction-item .info .tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:10px;font-size:10px;background:var(--bg-panel);color:var(--text-secondary);border:1px solid var(--border)}
.weather-widget{background:linear-gradient(135deg,#1a73e8,#4fc3f7);border-radius:var(--radius);padding:20px;margin-bottom:15px;color:#fff}
.weather-widget .temp{font-size:36px;font-weight:300}
.weather-widget .desc{font-size:14px;opacity:0.9;margin-top:4px}
.weather-widget .details{display:flex;gap:20px;margin-top:12px;font-size:12px;opacity:0.85}
.weather-widget .details span{display:flex;align-items:center;gap:4px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;width:90%;max-width:700px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:modalIn 0.3s ease}
@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{padding:24px;border-bottom:1px solid var(--border);position:relative}
.modal-header h2{font-size:20px;color:#fff;margin-bottom:4px}
.modal-header .subtitle{font-size:13px;color:var(--text-secondary)}
.modal-body{padding:24px}
.modal-close{position:absolute;top:20px;right:20px;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--bg-dark);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.modal-close:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.detail-images{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.detail-images .img-item{height:150px;border-radius:var(--radius-sm);object-fit:cover;background:var(--bg-panel);width:100%}
.detail-images .img-item:first-child{grid-column:span 2;height:200px}
.info-section{margin-bottom:20px}
.info-section h3{font-size:16px;color:#fff;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.info-section p{font-size:14px;color:var(--text-secondary);line-height:1.8}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-grid .info-item{padding:10px;background:var(--bg-dark);border-radius:var(--radius-sm);border:1px solid var(--border)}
.info-grid .info-item .label{font-size:11px;color:var(--text-secondary);margin-bottom:4px}
.info-grid .info-item .value{font-size:14px;color:#fff;font-weight:500}
.transport-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-dark);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px}
.transport-item i{font-size:18px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.transport-item i.train{background:rgba(26,115,232,0.2);color:var(--primary)}
.transport-item i.plane{background:rgba(52,168,83,0.2);color:var(--success)}
.transport-item i.bus{background:rgba(251,188,4,0.2);color:var(--warning)}
.transport-item .info .name{font-size:14px;color:#fff}
.transport-item .info .desc{font-size:12px;color:var(--text-secondary)}
.map-controls{position:absolute;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.map-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:var(--transition);box-shadow:var(--shadow)}
.map-btn:hover{background:var(--primary);border-color:var(--primary)}
.map-legend{position:absolute;bottom:30px;right:20px;z-index:1000;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;box-shadow:var(--shadow)}
.map-legend .legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.map-legend .legend-item:last-child{margin-bottom:0}
.map-legend .dot{width:10px;height:10px;border-radius:50%}
.province-info{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 24px;box-shadow:var(--shadow);font-size:14px;display:none}
.province-info.visible{display:block}
.province-info span{color:var(--primary);font-weight:600}
.loading{display:flex;align-items:center;justify-content:center;height:200px}
.loading::after{content:'';width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stats-bar{display:flex;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border)}
.stat-item{text-align:center}
.stat-item .num{font-size:18px;font-weight:700;color:var(--primary)}
.stat-item .label{font-size:10px;color:var(--text-secondary)}
.leaflet-popup-content-wrapper{background:var(--bg-card);color:var(--text-primary);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--bg-card)}
.leaflet-popup-content{margin:12px 16px;font-size:13px}
.leaflet-popup-content .popup-title{font-size:15px;font-weight:600;color:#fff;margin-bottom:6px}
.leaflet-popup-content .popup-desc{font-size:12px;color:var(--text-secondary);line-height:1.5}
.leaflet-container a.leaflet-popup-close-button{color:var(--text-secondary)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg-dark)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease}
.slide-up{animation:slideUp 0.4s ease}
.mobile-toggle{display:none;position:absolute;top:20px;left:20px;z-index:1001;width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);cursor:pointer;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow)}
@media(max-width:768px){
  #sidebar{position:absolute;left:-380px;top:0;bottom:0;box-shadow:var(--shadow)}
  #sidebar.open{left:0}
  .mobile-toggle{display:flex}
}
</style>
</head>
<body>
<div id="app">
  <button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1><i class="fas fa-mountain-sun"></i> 华夏全景</h1>
      <p>中国旅游指南 · 全国城市与景点全覆盖</p>
    </div>
    <div class="search-box">
      <div class="input-wrap">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="searchInput" placeholder="搜索城市、景点、地标..." />
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="stats-bar">
      <div class="stat-item"><div class="num" id="statCities">34</div><div class="label">省级区划</div></div>
      <div class="stat-item"><div class="num" id="statSpots">0</div><div class="label">景点收录</div></div>
      <div class="stat-item"><div class="num" id="statRoutes">0</div><div class="label">路线推荐</div></div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="provinces"><i class="fas fa-map"></i> 省市</button>
      <button class="tab-btn" data-tab="attractions"><i class="fas fa-camera"></i> 景点</button>
      <button class="tab-btn" data-tab="weather"><i class="fas fa-cloud-sun"></i> 天气</button>
      <button class="tab-btn" data-tab="transport"><i class="fas fa-route"></i> 交通</button>
    </div>
    <div class="sidebar-content" id="sidebarContent"></div>
  </aside>
  <div id="main-content">
    <div id="map"></div>
    <div class="map-controls">
      <button class="map-btn" id="btnHome" title="回到全国视图"><i class="fas fa-home"></i></button>
      <button class="map-btn" id="btnLocate" title="我的位置"><i class="fas fa-crosshairs"></i></button>
      <button class="map-btn" id="btnLayer" title="切换图层"><i class="fas fa-layer-group"></i></button>
      <button class="map-btn" id="btnFullscreen" title="全屏"><i class="fas fa-expand"></i></button>
    </div>
    <div class="map-legend">
      <div class="legend-item"><div class="dot" style="background:#ea4335"></div> 热门景点</div>
      <div class="legend-item"><div class="dot" style="background:#1a73e8"></div> 城市中心</div>
      <div class="legend-item"><div class="dot" style="background:#34a853"></div> 自然风光</div>
      <div class="legend-item"><div class="dot" style="background:#fbbc04"></div> 历史古迹</div>
    </div>
    <div class="province-info" id="provinceInfo">当前视图：<span id="currentProvince">全国</span></div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle">景点详情</h2>
      <div class="subtitle" id="modalSubtitle"></div>
      <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

// ========== STATE ==========
let currentTab='provinces',currentProvince=null,map,markers=[],layerGroups={},currentLayer='gaode',weatherCache={};

// ========== INIT ==========
document.addEventListener('DOMContentLoaded',()=>{
  initMap();
  renderSidebar();
  bindEvents();
  updateStats();
});

function initMap(){
  map=L.map('map',{center:[35.0,104.0],zoom:4,minZoom:3,maxZoom:18,zoomControl:false,attributionControl:false});
  L.control.zoom({position:'topright'}).addTo(map);
  L.control.attribution({position:'bottomright',prefix:false}).addTo(map);
  loadTileLayer('gaode');
  addProvinceMarkers();
  map.on('moveend',updateProvinceInfo);
}

function loadTileLayer(type){
  if(window._tileLayer)map.removeLayer(window._tileLayer);
  const tiles={
    gaode:{url:'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',attr:'©高德地图',sub:'1234'},
    osm:{url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',attr:'©OpenStreetMap',sub:'abc'},
    satellite:{url:''}
  };
  window._tileLayer=L.tileLayer(tiles[type].url,{attribution:tiles[type].attr,subdomains:tiles[type].sub,maxZoom:19}).addTo(map);
  currentLayer=type;
}

function addProvinceMarkers(){
  PROVINCES_DATA.forEach(prov=>{
    const marker=L.marker(prov.center,{icon:createIcon('province')}).addTo(map);
    marker.bindPopup(`<div class="popup-title">${prov.name}</div><div class="popup-desc">${prov.desc}</div><div style="margin-top:8px;color:#1a73e8;cursor:pointer" onclick="showProvince('${prov.name}')"><i class="fas fa-arrow-right"></i> 查看详情</div>`);
    marker.on('click',()=>showProvince(prov.name));
    markers.push(marker);
  });
}

function createIcon(type){
  const c={province:'#1a73e8',attraction:'#ea4335',nature:'#34a853',history:'#fbbc04',modern:'#9c27b0',street:'#ff9800'};
  const i={province:'fa-map-marker-alt',attraction:'fa-camera',nature:'fa-tree',history:'fa-landmark',modern:'fa-city',street:'fa-store'};
  return L.divIcon({className:'',html:`<div style="width:32px;height:32px;border-radius:50%;background:${c[type]||c.province};display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);border:2px solid #fff"><i class="fas ${i[type]||i.province}" style="font-size:12px"></i></div>`,iconSize:[32,32],iconAnchor:[16,16]});
}

function showProvince(name){
  currentProvince=name;
  const prov=PROVINCES_DATA.find(p=>p.name===name);
  if(!prov)return;
  map.flyTo(prov.center,prov.zoom,{duration:1.5});
  document.getElementById('currentProvince').textContent=name;
  document.getElementById('provinceInfo').classList.add('visible');
  if(ATTRACTIONS_DATA[name]){
    addAttrMarkers(name);
    renderAttrList(name);
    switchTab('attractions');
  }
  loadWeather(name,prov.center);
}

function addAttrMarkers(name){
  Object.values(layerGroups).forEach(g=>map.removeLayer(g));
  layerGroups={};
  const attrs=ATTRACTIONS_DATA[name];
  if(!attrs)return;
  const group=L.featureGroup();
  attrs.forEach(attr=>{
    const tc={'历史古迹':'#fbbc04','自然风光':'#34a853','现代都市':'#9c27b0','特色街区':'#ff9800'};
    const m=L.circleMarker(attr.coord,{radius:8,fillColor:tc[attr.type]||'#ea4335',color:'#fff',weight:2,opacity:1,fillOpacity:0.8});
    m.bindPopup(`<div class="popup-title">${attr.name}</div><div class="popup-desc">${attr.desc.substring(0,60)}...</div><div style="margin-top:6px;color:#1a73e8;cursor:pointer" onclick="showAttrDetail('${name}','${attr.name}')"><i class="fas fa-info-circle"></i> 详细信息</div>`);
    m.addTo(group);
  });
  group.addTo(map);
  layerGroups[name]=group;
}

function showAttrDetail(provName,attrName){
  const attrs=ATTRACTIONS_DATA[provName];
  const attr=attrs?.find(a=>a.name===attrName);
  if(!attr)return;
  document.getElementById('modalTitle').textContent=attr.name;
  document.getElementById('modalSubtitle').textContent=`${provName} · ${attr.type}`;
  let imgs='';
  if(attr.img)imgs=`<div class="detail-images"><img class="img-item" src="${attr.img}" onerror="this.style.display='none'"/></div>`;
  document.getElementById('modalBody').innerHTML=`
    ${imgs}
    <div class="info-section"><h3><i class="fas fa-info-circle"></i> 景点介绍</h3><p>${attr.desc}</p></div>
    <div class="info-section"><h3><i class="fas fa-clipboard-list"></i> 实用信息</h3>
    <div class="info-grid">
      <div class="info-item"><div class="label">门票价格</div><div class="value">${attr.tickets||'暂无'}</div></div>
      <div class="info-item"><div class="label">开放时间</div><div class="value">${attr.hours||'暂无'}</div></div>
      <div class="info-item"><div class="label">建议游玩</div><div class="value">${attr.duration||'暂无'}</div></div>
      <div class="info-item"><div class="label">景点类型</div><div class="value">${attr.type}</div></div>
    </div></div>
    ${attr.tips?`<div class="info-section"><h3><i class="fas fa-lightbulb"></i> 游玩贴士</h3><p>${attr.tips}</p></div>`:''}
    ${attr.wh?'<div class="info-section"><p style="color:#fbbc04"><i class="fas fa-star"></i> 联合国教科文组织世界文化遗产</p></div>':''}
  `;
  document.getElementById('modalOverlay').classList.add('active');
}

// ========== WEATHER ==========
async function loadWeather(city,coord){
  const el=document.getElementById('weather');
  if(!el)return;
  if(weatherCache[city]&&Date.now()-weatherCache[city].time<1800000){
    renderWeather(city,weatherCache[city].data);return;
  }
  el.innerHTML='<div class="loading"></div>';
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coord[1]}&longitude=${coord[0]}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,apparent_temperature&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,weather_code&timezone=auto&forecast_days=7`);
    if(!r.ok)throw new Error();
    const d=await r.json();
    weatherCache[city]={data:d,time:Date.now()};
    renderWeather(city,d);
  }catch(e){
    el.innerHTML='<div class="card-text">天气加载失败</div>';
  }
}

function renderWeather(city,d){
  const cur=d.current,dy=d.daily;
  const wc={0:'晴朗',1:'大部分晴朗',2:'多云',3:'阴天',45:'雾',51:'毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'阵雨',81:'强阵雨',82:'暴雨',95:'雷暴'};
  let h=`<div class="weather-widget slide-up"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:16px;opacity:0.9">${city} · 实时天气</div><div class="temp">${Math.round(cur.temperature_2m)}°</div><div class="desc">${wc[cur.weather_code]||'未知'}</div></div><div style="text-align:right;font-size:12px;opacity:0.8"><div>体感${Math.round(cur.apparent_temperature)}°C</div><div style="margin-top:4px">湿度${cur.relative_humidity_2m}%</div><div style="margin-top:4px">风速${cur.wind_speed_10m}km/h</div></div></div><div style="margin-top:15px;display:flex;gap:8px;overflow-x:auto;padding-bottom:5px">`;
  for(let i=0;i<7;i++){
    const dt=new Date(dy.time[i]);
    const dn=['周日','周一','周二','周三','周四','周五','周六'];
    h+=`<div style="min-width:60px;text-align:center;padding:8px 6px;background:rgba(255,255,255,0.1);border-radius:8px"><div style="font-size:11px;opacity:0.8">${i===0?'今天':dn[dt.getDay()]}</div><div style="font-size:18px;margin:4px 0">${Math.round(dy.temperature_2m_max[i])}°</div><div style="font-size:11px;opacity:0.7">${Math.round(dy.temperature_2m_min[i])}°</div></div>`;
  }
  h+='</div></div>';
  document.getElementById('weather').innerHTML=h;
}

// ========== RENDER ==========
function renderSidebar(){
  const c=document.getElementById('sidebarContent');
  switch(currentTab){
    case'provinces':renderProvinces();break;
    case'attractions':renderAttrList(currentProvince);break;
    case'weather':renderWeatherTab();break;
    case'transport':renderTransportTab();break;
  }
}

function renderProvinces(){
  const c=document.getElementById('sidebarContent');
  const types={};
  PROVINCES_DATA.forEach(p=>{if(!types[p.type])types[p.type]=[];types[p.type].push(p)});
  let h='';
  ['直辖市','省','自治区','特别行政区'].forEach(t=>{
    if(!types[t])return;
    h+=`<div class="card"><div class="card-title"><i class="fas fa-map-marker-alt"></i> ${t} (${types[t].length})</div><div class="city-grid">`;
    types[t].forEach(p=>{
      const cnt=ATTRACTIONS_DATA[p.name]?.length||0;
      h+=`<div class="city-item" onclick="showProvince('${p.name}')"><div class="city-name">${p.name}</div><div class="city-count">${cnt}个景点</div></div>`;
    });
    h+='</div></div>';
  });
  c.innerHTML=h;
}

function renderAttrList(provName){
  const c=document.getElementById('sidebarContent');
  if(!provName||!ATTRACTIONS_DATA[provName]){
    let h='<div class="card"><div class="card-title"><i class="fas fa-mountain-sun"></i> 热门景点</div><div class="card-text">选择省份查看景点</div></div>';
    Object.entries(ATTRACTIONS_DATA).slice(0,5).forEach(([prov,attrs])=>{
      h+=`<div class="card"><div class="card-title">${prov}</div>`;
      attrs.slice(0,3).forEach(a=>{
        h+=`<div class="attraction-item" onclick="showAttrDetail('${prov}','${a.name}')"><img class="thumb" src="${a.img}" onerror="this.style.background='#0f3460'"/><div class="info"><div class="name">${a.name}</div><div class="desc">${a.desc.substring(0,60)}...</div><div class="tags"><span class="tag">${a.type}</span></div></div></div>`;
      });
      h+='</div>';
    });
    c.innerHTML=h;return;
  }
  const attrs=ATTRACTIONS_DATA[provName];
  let h=`<div class="card"><div class="card-title"><i class="fas fa-map-marker-alt"></i> ${provName} · ${attrs.length}个景点</div></div>`;
  attrs.forEach(a=>{
    h+=`<div class="attraction-item" onclick="showAttrDetail('${provName}','${a.name}')"><img class="thumb" src="${a.img}" onerror="this.style.background='#0f3460'"/><div class="info"><div class="name">${a.name}</div><div class="desc">${a.desc.substring(0,80)}...</div><div class="tags"><span class="tag">${a.type}</span>${a.wh?'<span class="tag" style="background:rgba(251,188,4,0.2);color:#fbbc04">世界遗产</span>':''}</div></div></div>`;
  });
  c.innerHTML=h;
}

function renderWeatherTab(){
  const c=document.getElementById('sidebarContent');
  if(currentProvince){
    const p=PROVINCES_DATA.find(x=>x.name===currentProvince);
    c.innerHTML='<div id="weather"></div>';
    loadWeather(currentProvince,p.center);
  }else{
    let h='<div class="card"><div class="card-title"><i class="fas fa-cloud-sun"></i> 全国天气</div><div class="card-text">点击省份查看天气</div></div><div id="weather-list">';
    PROVINCES_DATA.slice(0,12).forEach(p=>{
      const sn=p.name.replace(/[^\w]/g,'_');

    });

    c.innerHTML=h;

function renderTransportTab(){
  const c=document.getElementById('sidebarContent');
  if(currentProvince&&TRANSPORT_DATA[currentProvince]){

    let h=`<div class="card"><div class="card-title"><i class="fas fa-route"></i> ${currentProvince} · 交通指南</div></div>`;
    if(t.train){h+='<div class="card"><div class="card-title" style="font-size:13px"><i class="fas fa-train" style="color:#1a73e8"></i> 高铁/火车</div>';t.train.forEach(x=>{h+=`<div class="transport-item"><i class="train fas fa-train"></i><div class="info"><div class="name">${x}</div></div></div>`});h+='</div>'}
    if(t.plane){h+='<div class="card"><div class="card-title" style="font-size:13px"><i class="fas fa-plane" style="color:#34a853"></i> 飞机</div>';t.plane.forEach(x=>{h+=`<div class="transport-item"><i class="plane fas fa-plane"></i><div class="info"><div class="name">${x}</div></div></div>`});h+='</div>'}
    if(t.bus){h+='<div class="card"><div class="card-title" style="font-size:13px"><i class="fas fa-bus" style="color:#fbbc04"></i> 大巴</div>';t.bus.forEach(x=>{h+=`<div class="transport-item"><i class="bus fas fa-bus"></i><div class="info"><div class="name">${x}</div></div></div>`});h+='</div>'}
    c.innerHTML=h;
  }else{
    let h='<div class="card"><div class="card-title"><i class="fas fa-route"></i> 交通查询</div><div class="card-text">选择出发城市</div></div><div class="card"><div class="card-title" style="font-size:13px">热门出发城市</div><div class="city-grid">';
    Object.keys(TRANSPORT_DATA).forEach(city=>{
      h+=`<div class="city-item" onclick="selectTransCity('${city}')"><div class="city-name">${city}</div></div>`;
    });
    h+='</div></div>';
    c.innerHTML=h;
  }
}

function selectProvWeather(name){
  currentProvince=name;
  const p=PROVINCES_DATA.find(x=>x.name===name);
  if(!p)return;
  showProvince(name);
  switchTab('weather');
}

function selectTransCity(city){
  currentProvince=city;
  renderTransportTab();
}

// ========== EVENTS ==========
function bindEvents(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  document.getElementById('searchInput').addEventListener('input',handleSearch);
  document.getElementById('btnHome').addEventListener('click',()=>{
    map.flyTo([35.0,104.0],4,{duration:1});
    currentProvince=null;
    document.getElementById('provinceInfo').classList.remove('visible');
    document.getElementById('currentProvince').textContent='全国';
    Object.values(layerGroups).forEach(g=>map.removeLayer(g));
    layerGroups={};
    renderProvinces();
    switchTab('provinces');
  });
  document.getElementById('btnLocate').addEventListener('click',()=>map.locate({setView:true,maxZoom:12}));
  document.getElementById('btnLayer').addEventListener('click',()=>{
    const l=['gaode','osm'];const i=(l.indexOf(currentLayer)+1)%l.length;loadTileLayer(l[i]);
  });
  document.getElementById('btnFullscreen').addEventListener('click',()=>{
    if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();
  });
  document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modalOverlay').classList.remove('active'));
  document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)document.getElementById('modalOverlay').classList.remove('active')});
  document.getElementById('mobileToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  renderSidebar();
}

function handleSearch(e){
  const q=e.target.value.trim().toLowerCase();
  const r=document.getElementById('searchResults');
  if(q.length<1){r.innerHTML='';return}
  let h='';
  PROVINCES_DATA.forEach(p=>{
    if(p.name.toLowerCase().includes(q)||p.capital.toLowerCase().includes(q))
      h+=`<div class="result-item" onclick="showProvince('${p.name}');document.getElementById('searchInput').value=''"><i class="fas fa-map-marker-alt" style="color:#1a73e8;margin-right:8px"></i>${p.name}</div>`;
  });
  Object.entries(ATTRACTIONS_DATA).forEach(([prov,attrs])=>{
    attrs.forEach(a=>{
      if(a.name.toLowerCase().includes(q))
        h+=`<div class="result-item" onclick="showAttrDetail('${prov}','${a.name}');document.getElementById('searchInput').value=''"><i class="fas fa-camera" style="color:#ea4335;margin-right:8px"></i>${a.name} <span style="color:#a0a0a0;font-size:11px">(${prov})</span></div>`;
    });
  });
  if(!h)h='<div class="card-text" style="padding:10px">未找到相关结果</div>';
  r.innerHTML=h;
}

function updateStats(){
  document.getElementById('statCities').textContent=PROVINCES_DATA.length;
  let t=0;Object.values(ATTRACTIONS_DATA).forEach(a=>t+=a.length);
  document.getElementById('statSpots').textContent=t;
  document.getElementById('statRoutes').textContent=Object.keys(TRANSPORT_DATA).length;
}

function updateProvinceInfo(){
  if(map.getZoom()<5){
    document.getElementById('currentProvince').textContent='全国';
    document.getElementById('provinceInfo').classList.add('visible');
  }
}

async function loadWeatherCard(name,coord){
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coord[1]}&longitude=${coord[0]}&current=temperature_2m,weather_code&timezone=auto`);
    const d=await r.json();
    const t=Math.round(d.current.temperature_2m);
    const sn=name.replace(/[^\w]/g,'_');
    const te=document.querySelector(`.wt-${sn}`),de=document.querySelector(`.wd-${sn}`);
    if(te)te.textContent=t+'°';
    if(de)de.textContent='实时温度';
  }catch(e){}
}

window.showProvince=showProvince;
window.showAttrDetail=showAttrDetail;
window.selectProvWeather=selectProvWeather;
window.selectTransCity=selectTransCity;
</script>
</body>
</html>
